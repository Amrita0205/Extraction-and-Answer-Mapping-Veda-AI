# Render blueprint. Point Render at the repo, pick "Blueprint", set
# GEMINI_API_KEY in the dashboard, and it deploys from here.
#
# Free instances sleep after ~15 minutes idle and take 30-60s to wake. The
# frontend shows a "waking up" state for exactly this reason, and a
# cron-job.org ping every 10 minutes to /api/health keeps it warm through the
# evaluation window.
services:
  - type: web
    name: veda-extraction-api
    runtime: python
    plan: free
    region: singapore
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: ALLOWED_ORIGINS
        value: "*"

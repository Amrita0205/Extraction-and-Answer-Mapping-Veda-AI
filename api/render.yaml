# Render blueprint. Point Render at the repo, pick "Blueprint", set
# GEMINI_API_KEY in the dashboard, and it deploys from here.
#
# Free instances sleep after ~15 minutes idle and take 30-60s to wake. The
# frontend shows a "waking up" state for exactly this reason, and a
# cron-job.org ping every 10 minutes to /api/health keeps it warm through the
# evaluation window.
services:
  - type: web
    name: veda-extraction-api
    runtime: python
    plan: free
    region: singapore
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: GEMINI_API_KEY
        sync: false
      # Measured on a rendered A4 page: this model answers in ~2.5s, where
      # gemini-3.6-flash takes ~190s and gemini-flash-lite-latest ~170s.
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      # The free tier allows 20 requests per day *per model*, and one answer
      # sheet costs one request per page. Each name here has its own quota
      # bucket, so a run that exhausts the first can finish on the next.
      - key: GEMINI_MODELS
        value: gemini-3.1-flash-lite,gemini-3.5-flash-lite,gemini-3.5-flash,gemini-3-flash-preview
      - key: ALLOWED_ORIGINS
        value: "*"
